# OneID 在线共享身份配置（由 DS_VI/configs/shared_identity/runtime_best.yaml 派生）
#
# 与上游的唯一差异：reliability.contextual.enabled 置为 false。
# 原因：contextual 拟合参数未随本仓库发布，且参数缺失时 reliability.py 会直接抛错
# （fail-fast）。在线链路不读任何工作簿与拟合产物；需要复现实验时显式改回
# true 并自行提供 theta_path。
#
# 其余字段与上游 runtime_best.yaml 逐字一致（含 cascade 段的 policy=blend 与
# accept_betp/single_accept_betp 操作点）。
# The only shipped shared-identity configuration (v6).
# 
# Every earlier file (v1..v5.1) is archived under archive/pre-v6/ and is NOT
# runnable from here: this file is the baseline every comparison arm and every
# ablation is measured against.
# 
schema_version: '1.0'
physical:
  weights:
    iou: 0.45
    center: 0.3
    area: 0.15
    confidence: 0.1
  center_scale_factor: 0.75
  gates:
    low_iou_gate: 0.05
    center_gate: 0.25
    geo_gate_m: 250.0
    max_center_distance_px: null
  null_prior: 0.15
  # Physical prior of paper Eq.(2): p[m,k] ~ exp(d^T f[m,k]), with
  # d = prior_scale * weights and d_null = null_logit (null -> derived from
  # null_prior and prior_scale so a perfect single candidate keeps 15% NULL).
  prior_scale: 6.0
  null_logit: null
  max_candidates_per_observation: 12
inference:
  eta: 1.5
  max_iter: 50
  tol: 1.0e-05
  epsilon: 1.0e-12
  projection:
    max_iter: 100
    tol: 1.0e-06
  # Paper Eq.(29) caps capacity per acquisition/channel block (block_capacity),
  # not per object column.  null = unconstrained.
  default_capacity: null
  capacity_projection: true
  capacity_mode: block_object_column
  block_capacity: 1.0
  truth_prior_smoothing: 1.0
  # Paper C.5: different epochs define different facts.
  time_invariant_attributes: []
  evidence_cap: null
  feedback_damping: 1.0
reliability:
  default: 0.7
  by_modality_attribute:
    optical:
      category: 0.88
      subtype: 0.72
      color: 0.73
      heading: 0.65
      orientation: 0.24
    sar:
      category: 0.78
      subtype: 0.6
      heading: 0.55
      orientation: 0.63
    temporal:
      presence: 0.8
      motion: 0.7
      orientation: 0.21
    cross_modal:
      category: 0.82
      subtype: 0.66
      heading: 0.6
      orientation: 0.24
  min: 0.35
  max: 0.97
  shrinkage: 0.75
  outlier_mixture: 0.0
  contextual:
    enabled: false
    config_path: null
    theta_path: DS_VI/configs/shared_identity/artifacts/contextual_theta_v1.json
provenance:
  group_budget: 1.0
  dedup_exact_replay: true
  grouping_mode: connected_component
  remove_deterministic_restatements: true
  budget_enabled: true
decision:
  identity_threshold: 0.6
  truth_threshold: 0.6
  qualified_truth_threshold: 0.4
  ambiguity_entropy: 0.9
  min_coverage: 0.5
  max_null_mass: 0.6
  contradiction_margin: 0.15
acquisition:
  association_entropy_trigger: 0.6
  truth_entropy_trigger: 0.6
  max_requests: 5
value_domains:
  category:
  - vehicle
  - tank
  - ship
  - aircraft
  - bridge
  - harbor
  - other
  subtype:
  - civilian_airliner
  - military_aircraft
  - small_aircraft
  - cargo_ship
  - fishing_boat
  - warship
  - small_boat
  - storage_tank
  - oil_tank
  - road_bridge
  - rail_bridge
  - pier
  - dock
  - car
  - truck
  - bus
  - unknown
  color:
  - white
  - gray
  - black
  - red
  - orange
  - yellow
  - green
  - blue
  - brown
  - multi
  state:
  - moving
  - static
  - moored
  - parked
  - under_construction
  - damaged
  - occluded
  - unknown
  size_bin:
  - small
  - medium
  - large
  - unknown
  heading:
  - north
  - east
  - south
  - west
  - unknown
  orientation:
  - horizontal
  - vertical
  - diagonal
  presence:
  - present
  - absent
  motion:
  - static
  - moving
  - unknown
cascade:
  residual_threshold: 0.5
  max_links:
    match: 4
    time: 6
  center_scale_factor:
    match: 0.75
    time: 1.5
  extra_links: 2
  extra_mode:
    match: pruned
    time: mutual
  extra_prior_floor: 0.2
  extra_margin:
    match: 0.3
    time: 0.2
  extra_consistency:
    match: []
    time:
    - subtype
    - color
    - size_bin
    - orientation
  consistency_mode: weighted
  consistency_tau: 0.0
  consistency_min_weight: 0.5
  policy: blend
  blend_weight: 0.5
  extra_policy: confirmed
  accept_betp:
    match: 0.5
    time: 0.5
  single_accept_betp: 0.3
  extra_displacement_gate:
    match: 2.0
    time: 2.0
