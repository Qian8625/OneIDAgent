name: CrossModalMatchSkill
display_name: Cross Modal Match Skill
type: skill
enabled: true

executor:
  model: CrossModalMatchSkill
  worker_name: CrossModalMatchSkill
  job_name: cross_modal_match_skill
  script: worker.py
  port: 20132
  host: 0.0.0.0
  calculate_type: control
  timeout_sec: 300

doc:
  path: skill.md
  description: Target-level optical-SAR matching with one-to-one pairs and modality-only candidates;
    pairing is delegated to CrossModalInterpret(shared_identity) with a local geometric fallback.

inputs:
  required:
    - rgb_image
    - sar_image
    - target
  optional:
    - rgb_detections
    - sar_candidates
    - sar_detections
    - iou_threshold
    - center_distance_threshold
    - score_threshold
    - match_strategy
    - visualize
    - top1
    - max_draw
  defaults:
    iou_threshold: 0.2
    center_distance_threshold: auto
    score_threshold: 0.3
    match_strategy: hybrid
    visualize: true
    top1: false
    max_draw: 20
  bindings:
    rgb_image: optical_image
    sar_image: sar_image
  allow_extra_args: false

normalizer:
  name: cross_modal_match
  module: normalizer.py

routing:
  keywords:
    - cross-modal
    - rgb sar
    - optical sar
    - match
    - confirm pair
    - matched pairs
    - object-level matching
    - fusion
    - deduplicate
    - 跨模态
    - 光学SAR
    - 匹配
    - 配对
    - 融合
    - 去重
  negative_keywords:
    - poi
    - geotiff
    - change
    - single image only
    - 兴趣点
    - 地理
    - 变化
    - 单图
  preferred_inputs:
    - optical_image
    - sar_image
  required_modalities:
    - rgb
    - sar
