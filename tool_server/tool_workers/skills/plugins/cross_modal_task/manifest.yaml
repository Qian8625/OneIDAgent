name: CrossModalTaskSkill
display_name: Cross Modal Task Skill
type: skill
enabled: true

executor:
  model: CrossModalTaskSkill
  worker_name: CrossModalTaskSkill
  job_name: cross_modal_task_skill
  script: worker.py
  port: 20131
  host: 0.0.0.0
  calculate_type: control
  timeout_sec: 300

doc:
  path: skill.md
  description: Task-level optical-SAR reasoning over cross-modal matching evidence.

inputs:
  required:
    - rgb_image
    - sar_image
    - target
    - task_type
  optional:
    - rgb_detections
    - sar_candidates
    - sar_detections
    - matched_pairs
    - rgb_only
    - sar_only
    - question
    - evidence_required
    - confidence_threshold
    - match_threshold
    - iou_threshold
    - visualize
    - max_draw
  defaults:
    evidence_required: true
    confidence_threshold: 0.3
    visualize: true
    max_draw: 20
  bindings:
    rgb_image: optical_image
    sar_image: sar_image
  allow_extra_args: false

normalizer:
  name: cross_modal_task
  module: normalizer.py

routing:
  keywords:
    - verify with sar
    - confirm with sar
    - sar evidence
    - optical sar consistency
    - sar attribution
    - recall candidate
    - cross-modal reasoning
    - task-level cross-modal
    - whether
    - exist
    - final conclusion
    - final judgment
    - cross-validate whether
    - supported by SAR
    - 用SAR确认
    - SAR证据
    - 光学SAR一致性
    - SAR归因
    - SAR补漏
    - 跨模态判断
  negative_keywords:
    - poi
    - geotiff
    - single-image measure
    - draw only
    - change
    - 兴趣点
    - 地理
    - 单图测量
    - 只画框
    - 变化
  preferred_inputs:
    - optical_image
    - sar_image
  required_modalities:
    - rgb
    - sar
