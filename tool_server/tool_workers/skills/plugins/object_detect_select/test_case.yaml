skill_name: ObjectDetectSelectSkill
enabled: true
tests:
  - name: select_smallest_storage_tank
    required_fixture_refs:
      - rgb_image
    params:
      image: "$rgb_image"
      target: storage tank
      selection_mode: smallest
      top_k: 1
      confidence_threshold: 0.25
      iou_threshold: 0.5
      detector: auto
      visualize: true
      max_draw: 20
    expect:
      error_code: 0
      structured:
        required_fields:
          - status
          - num_candidates
          - selected
  - name: select_largest_airplane
    required_fixture_refs:
      - rgb_image
    params:
      image: "$rgb_image"
      target: airplane
      selection_mode: largest
      top_k: 1
      confidence_threshold: 0.25
      iou_threshold: 0.5
      detector: auto
      visualize: true
      max_draw: 20
    expect:
      error_code: 0
      structured:
        required_fields:
          - status
          - num_candidates
          - selected
  - name: no_detection_returns_no_detection
    required_fixture_refs:
      - rgb_image
    params:
      image: "$rgb_image"
      target: nonexisting imaginary object xyz
      selection_mode: largest
      confidence_threshold: 0.99
      detector: object_detection
      visualize: false
    expect:
      error_code: 0
      structured:
        status: no_detection
        required_fields:
          - status
          - num_candidates
          - selected
