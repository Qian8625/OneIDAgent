name: ObjectVisualOutputSkill
display_name: Object Visual Output Skill
type: skill
enabled: true

executor:
  model: ObjectVisualOutputSkill
  worker_name: ObjectVisualOutputSkill
  job_name: object_visual_output_skill
  script: worker.py
  port: 20129
  host: 0.0.0.0
  calculate_type: control
  timeout_sec: 120

doc:
  path: skill.md
  description: Final visualization layer for existing detection, selection, and measurement structured outputs.

inputs:
  required:
    - image
    - visual_type
  optional:
    - bbox
    - bboxes
    - points
    - detections
    - selected_detections
    - labels
    - measurement
    - output_path
    - color
    - thickness
    - max_draw
    - structured
    - input_registry
    - visual_objects
  defaults:
    visual_type: box
    color: red
    thickness: 2
    max_draw: 20
  bindings:
    image: primary_image
  allow_extra_args: false

normalizer:
  name: object_visual_output
  module: normalizer.py

routing:
  keywords:
    - draw
    - box
    - mark
    - plot
    - visualize
    - point
    - annotate
    - highlight
    - 画框
    - 标注
    - 可视化
    - 画点
    - 标记
    - 高亮
    - 框出
  negative_keywords:
    - measure only
    - distance only
    - area only
    - sar
    - cross-modal
    - geotiff
    - poi
    - 只测量
    - 只计算
    - 跨模态
    - 兴趣点
  preferred_inputs:
    - primary_image
  required_modalities: []
